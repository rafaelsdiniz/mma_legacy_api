services:
  postgres:
    image: postgres:17-alpine
    container_name: mma-legacy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mma_legacy
    ports:
      - "5432:5432"
    volumes:
      - mma-legacy-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mma_legacy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mma-legacy-dados:
